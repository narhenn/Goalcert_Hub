services:
  # Hub Backend (FastAPI)
  - type: web
    name: goalcert-hub-backend
    runtime: python
    plan: free
    rootDir: hub/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6"
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Gateway — these point to the other Render services
      - key: TWIN_BASE_URL
        value: ""
      - key: AGENTS_BASE_URL
        value: ""
      - key: SCENARIO_BASE_URL
        value: ""
      - key: AGENTBUILDER_BASE_URL
        value: ""

  # Hub Frontend (React static site)
  - type: web
    name: goalcert-hub
    runtime: static
    plan: free
    rootDir: hub/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: goalcert-hub-backend
          type: web
          property: host
