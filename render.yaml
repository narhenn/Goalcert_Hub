services:
  # Hub Backend (FastAPI)
  - type: web
    name: goalcert-hub-backend
    runtime: python
    plan: free
    rootDir: hub/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6"
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Postgres (Render database, schema "hub" — automind owns "public")
      - key: DATABASE_URL
        sync: false
      # ── Secure gateway to the 3 platforms ──
      - key: TWIN_BASE_URL
        value: "https://goalcert-nextxr.onrender.com"
      - key: TWIN_PATH_PREFIX
        value: "/api/v1"
      - key: TWIN_API_KEY
        sync: false
      - key: SCENARIO_BASE_URL
        value: "https://goalcert-sim-engine.onrender.com"
      - key: SCENARIO_PATH_PREFIX
        value: ""
      - key: SCENARIO_API_KEY
        sync: false
      - key: AGENTS_BASE_URL
        value: "https://goalcert-automind.onrender.com"
      - key: AGENTS_PATH_PREFIX
        value: "/api/v1/agents"
      - key: AGENTBUILDER_BASE_URL
        value: "https://goalcert-automind.onrender.com"
      - key: AGENTBUILDER_PATH_PREFIX
        value: "/api/v1/builder"

  # Hub Frontend (React static site with API proxy)
  - type: web
    name: goalcert-hub
    runtime: static
    plan: free
    rootDir: hub/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Proxy all /api/* requests to the backend service
      - type: proxy
        source: /api/*
        destination: https://goalcert-hub-backend.onrender.com/api/*
      # Everything else serves the SPA
      - type: rewrite
        source: /*
        destination: /index.html
