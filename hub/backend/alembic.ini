# alembic.ini — migration config for the GoalCert Hub backend.
#
# The database URL is NOT set here on purpose: migrations/env.py imports it
# from db.py so the migrations always target exactly the same DATABASE_URL the
# app itself uses (SQLite locally, Postgres in prod). One source of truth.
#
# Run from hub/backend:  python manage.py migrate      (or: alembic upgrade head)

[alembic]
script_location = migrations

# 0001_initial_schema.py, 0002_add_x.py, ... — ordered and readable on disk.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
version_path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
